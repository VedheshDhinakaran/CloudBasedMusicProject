services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: carnaticDB
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./server_NodeBackend
    env_file:
      - ./server_NodeBackend/.env
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/carnaticDB
    depends_on:
      - mongo

  frontend:
    build:
      context: ./client
      args:
        REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
